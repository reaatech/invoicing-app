name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  deps-check:
    name: Deps (Major + Patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check for outdated major and patch versions
        run: |
          npm outdated --json 2>/dev/null | node -e '
            const chunks = [];
            process.stdin.on("data", c => chunks.push(c));
            process.stdin.on("end", () => {
              const input = Buffer.concat(chunks).toString().trim();
              if (!input) { console.log("All dependencies up to date."); process.exit(0); }
              const deps = JSON.parse(input);
              const semverDiff = (current, latest) => {
                const c = current.replace(/^[~^>=<]*/,"").split(".").map(Number);
                const l = latest.split(".").map(Number);
                if (l[0] > c[0]) return "major";
                if (l[1] > c[1]) return "minor";
                return "patch";
              };
              const outdated = Object.entries(deps).filter(([_,v]) => {
                const t = semverDiff(v.current, v.latest);
                return t === "major" || t === "patch";
              });
              if (outdated.length) {
                console.log("Outdated (major or patch):");
                outdated.forEach(([name,v]) => console.log(`  ${name}: ${v.current} → ${v.latest}`));
                process.exit(1);
              }
              console.log("No major or patch updates needed.");
            });
          '

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b
      - run: npx tsc -b tsconfig.preload.json

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build (Vite + TSC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  electron-build:
    name: Electron Package
    runs-on: ubuntu-latest
    needs: [audit, lint, typecheck, format, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libsecret-1-0
      - run: npm ci
      - run: npx electron-rebuild
      - run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
