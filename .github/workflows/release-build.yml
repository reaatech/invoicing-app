name: Release Build

on:
  push:
    tags: ['v*']

# Prevent concurrent runs for the same tag from racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc -b tsconfig.node.json

      - run: npx tsc -b tsconfig.preload.json

      - run: npx vite build --outDir dist/electron/app

      # Cross‑platform file copy (replaces mkdir -p / cp -R).
      - run: >
          node -e "
            const fs = require('fs');
            fs.mkdirSync('dist/electron/database/migrations', {recursive: true});
            fs.cpSync('electron/database/migrations', 'dist/electron/database/migrations', {recursive: true});
            fs.mkdirSync('dist/electron/templates', {recursive: true});
            fs.cpSync('src/templates', 'dist/electron/templates', {recursive: true});
          "

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
