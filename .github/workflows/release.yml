name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare ${{ github.event_name == 'push' && 'bump + tag' || 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.done.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve tag
        id: done
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "${{ github.event_name }}" = "push" ]; then
            if git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tag v$VERSION already exists."
              echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            TAG="v$NEW_VERSION"

            node -e "
              const fs = require('fs');
              const pkg = require('./package.json');
              pkg.version = '$NEW_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "

            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add package.json
            git commit -m "chore: release $TAG"
            git tag "$TAG"
            git push origin main --tags

            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            TAG="v$VERSION"

            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Error: tag $TAG does not exist. Push a lockfile change to create it."
              exit 1
            fi

            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc -b tsconfig.node.json

      - run: npx tsc -b tsconfig.preload.json

      - run: npx vite build --outDir dist/electron/app

      - run: >
          node -e "
            const fs = require('fs');
            fs.mkdirSync('dist/electron/database/migrations', {recursive: true});
            fs.cpSync('electron/database/migrations', 'dist/electron/database/migrations', {recursive: true});
            fs.mkdirSync('dist/electron/templates', {recursive: true});
            fs.cpSync('src/templates', 'dist/electron/templates', {recursive: true});
          "

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ github.token }}
